<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Handwritten Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 My Handwritten Notes</h1>
        <p>Class 10 • Simple Notes • Board Preparation</p>
    </header>

    <main>

        <h2>Choose Your Subject</h2>

        <div class="subjects">

            <div class="card">
                <h3>🧪 Science</h3>
                <p>Handwritten Science Notes</p>
                <button onclick="openSubject('Science')">
                    View Notes
                </button>
            </div>

            <div class="card">
                <h3>🌍 Social Science</h3>
                <p>History, Geography, Civics & Economics</p>
                <button onclick="openSubject('SST')">
                    View Notes
                </button>
            </div>

            <div class="card">
                <h3>📐 Mathematics</h3>
                <p>Chapter-wise Maths Notes</p>
                <button onclick="openSubject('Maths')">
                    View Notes
                </button>
            </div>

            <div class="card">
                <h3>📖 English</h3>
                <p>Literature & Grammar Notes</p>
                <button onclick="openSubject('English')">
                    View Notes
                </button>
            </div>

        </div>

    </main>

    <footer>
        <p>Made for Class 10 students ❤️</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
